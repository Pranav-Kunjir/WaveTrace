services:
  - type: web
    name: wavetrace-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: WAVETRACE_DATA_DIR
        value: /var/data
      - key: FRONTEND_URL
        sync: false
    disk:
      name: wavetrace-data
      mountPath: /var/data
      sizeGB: 10